<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .bar{transform-box:fill-box;transform-origin:center;animation:eq 1.2s ease-in-out infinite}
  @keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
  .hub{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%{transform:scale(1)}6%{transform:scale(1.18)}14%,100%{transform:scale(1)}}
  .peer{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-out infinite}
  @keyframes pop{0%,44%{transform:scale(1)}52%{transform:scale(1.3)}62%,100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-2.5s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <g fill="none" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="round">
        <path class="bar" d="M9 28v8" style="animation-delay:-.4s"/>
        <path class="bar" d="M15 22v20" style="animation-delay:-.9s;animation-duration:1.5s"/>
        <path class="bar" d="M21 26v12" style="animation-delay:-.2s;animation-duration:1s"/>
        <path d="M27 32h7M37 32 50 18M37 32h14M37 32 50 46"/>
      </g>
      <g fill="#c5ff6e">
        <circle r="1.7" opacity="0"><animateMotion path="M37 32 50 18" dur="2.4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.08;.46;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.4;.46;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle r="1.7" opacity="0"><animateMotion path="M37 32h14" dur="2.4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.08;.46;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.4;.46;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle r="1.7" opacity="0"><animateMotion path="M37 32 50 46" dur="2.4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.08;.46;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.4;.46;1" dur="2.4s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#0a0a0a">
        <circle class="hub" cx="36" cy="32" r="5.5"/>
        <circle class="peer" cx="51" cy="17" r="4.5"/>
        <circle class="peer" cx="53" cy="32" r="4.5"/>
        <circle class="peer" cx="51" cy="47" r="4.5"/>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
