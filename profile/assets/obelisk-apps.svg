<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .t{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-in-out infinite}
  @keyframes pop{0%,20%,100%{transform:scale(1)}8%{transform:scale(1.18)}}
  .lit{animation:lit 4s steps(1) infinite}
  @keyframes lit{0%,24%{fill:#b4f953}25%,100%{fill:#0a0a0a}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-1.9s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <rect class="t" x="12" y="12" width="18" height="18" rx="5" fill="#0a0a0a"/>
      <rect class="t" x="34" y="12" width="18" height="18" rx="5" fill="#0a0a0a" style="animation-delay:-3s"/>
      <rect class="t" x="12" y="34" width="18" height="18" rx="5" fill="#0a0a0a" style="animation-delay:-1s"/>
      <rect class="t" x="34" y="34" width="18" height="18" rx="5" fill="#0a0a0a" style="animation-delay:-2s"/>
      <path d="M40 38.5 L48 43 L40 47.5 Z" fill="#b4f953"/>
      <circle cx="21" cy="21" r="3.2" fill="#b4f953"/><circle cx="43" cy="21" r="3.2" fill="#b4f953" opacity="0.5"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
