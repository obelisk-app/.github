<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .ring{fill:none;stroke:#0a0a0a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
  @keyframes ring{0%{transform:scale(.4);opacity:0}15%{opacity:.8}100%{transform:scale(1.6);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-3.1s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <circle class="ring" cx="46" cy="16" r="6"/><circle class="ring" cx="46" cy="16" r="6" style="animation-delay:-1.5s"/>
      <circle cx="46" cy="16" r="3" fill="#0a0a0a"/>
      <path d="M22 54 L20 30 C20 18 26 10 31 10 C37 10 41 18 40 28 L42 54 Z" fill="#0a0a0a"/>
      <path d="M10 54.5 H54" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
