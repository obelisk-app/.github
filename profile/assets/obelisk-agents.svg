<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .beacon{animation:bc 2.5s ease-in-out infinite}
  @keyframes bc{0%,100%{opacity:.15}50%{opacity:1}}
  .ping{fill:none;stroke:#0a0a0a;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ping 2.5s ease-out infinite}
  @keyframes ping{0%,40%{transform:scale(1);opacity:0}45%{opacity:.7}90%,100%{transform:scale(3.2);opacity:0}}
  .eyes{animation:look 6s ease-in-out infinite}
  @keyframes look{0%,14%{transform:translateX(0)}20%,34%{transform:translateX(-3px)}40%,54%{transform:translateX(3px)}60%,100%{transform:translateX(0)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 6s ease-in-out infinite}
  @keyframes blink{0%,74%,80%,86%,100%{transform:scaleY(1)}77%,83%{transform:scaleY(.12)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-3.75s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <path d="M32 13v6" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="round"/>
      <circle class="ping" cx="32" cy="11.5" r="3.5"/>
      <circle cx="32" cy="11.5" r="3.5" fill="#0a0a0a"/>
      <circle class="beacon" cx="32" cy="11.5" r="1.6" fill="#c5ff6e"/>
      <rect x="8.5" y="30" width="5" height="11" rx="2.5" fill="#0a0a0a"/>
      <rect x="50.5" y="30" width="5" height="11" rx="2.5" fill="#0a0a0a"/>
      <rect x="15" y="20" width="34" height="31" rx="9" fill="#0a0a0a"/>
      <g class="eyes">
        <circle class="eye" cx="25.5" cy="33" r="4" fill="#b4f953"/>
        <circle class="eye" cx="38.5" cy="33" r="4" fill="#b4f953"/>
      </g>
      <path d="M27 42.5h10" stroke="#b4f953" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
