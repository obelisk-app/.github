<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .draw{stroke-dasharray:70;animation:draw 4s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:70}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-70}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-4.4s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <path d="M12 46 C 20 18, 44 46, 52 18" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round" class="draw"/>
      <path d="M12 46 L20 18 M52 18 L44 46" stroke="#0a0a0a" stroke-width="1.4" stroke-dasharray="2 2"/>
      <rect x="9" y="43" width="6" height="6" rx="1" fill="#f4fbff" stroke="#0a0a0a" stroke-width="2"/>
      <rect x="49" y="15" width="6" height="6" rx="1" fill="#f4fbff" stroke="#0a0a0a" stroke-width="2"/>
      <circle cx="20" cy="18" r="2.6" fill="#0a0a0a"/><circle cx="44" cy="46" r="2.6" fill="#0a0a0a"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
