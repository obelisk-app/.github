<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .rise{animation:rise 5s ease-in-out infinite}
  @keyframes rise{0%,100%{transform:translateY(3px)}50%{transform:translateY(-2px)}}
  .drift{animation:drift 7s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-0.6s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <g class="rise"><path d="M32 8 L36.5 13.5 L39 50 L25 50 L27.5 13.5 Z" fill="#0a0a0a"/><path d="M31.4 11 L28.8 14.2 L26.6 49 L31.4 49 Z" fill="#ffffff" opacity="0.18"/></g>
      <g class="drift"><path d="M14 52 a8 8 0 0 1 6-12 a10 10 0 0 1 18-3 a8 8 0 0 1 12 6 a6 6 0 0 1 0 12 H17 a6 6 0 0 1 -3-3z" fill="#f4fbff" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="round"/></g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
