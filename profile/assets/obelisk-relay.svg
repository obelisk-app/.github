<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .core{transform-box:fill-box;transform-origin:center;animation:beat 3s ease-in-out infinite}
  @keyframes beat{0%{transform:scale(1)}6%{transform:scale(1.25)}14%,100%{transform:scale(1)}}
  .ring{fill:none;stroke:#0a0a0a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.6}45%,100%{transform:scale(7);opacity:0}}
  .arc{animation:arc 3s ease-out infinite}
  @keyframes arc{0%,4%{opacity:.25}14%{opacity:1}70%{opacity:1}92%,100%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float" style="animation-delay:-1.25s">
  <clipPath id="tc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#tc)">
    <rect width="108" height="108" fill="url(#g)"/>
    <g transform="scale(1.6875)">
      <circle class="ring" cx="32" cy="32" r="5.5"/>
      <g fill="none" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="round">
        <path class="arc" d="M22.6 22.6a13.2 13.2 0 0 0 0 18.8M41.4 41.4a13.2 13.2 0 0 0 0-18.8"/>
        <path class="arc" style="animation-delay:.3s" d="M16.7 16.7a21.6 21.6 0 0 0 0 30.6M47.3 47.3a21.6 21.6 0 0 0 0-30.6"/>
      </g>
      <circle class="core" cx="32" cy="32" r="5.5" fill="#0a0a0a"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
